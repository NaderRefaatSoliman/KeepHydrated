name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepHydrated-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew test --stacktrace --no-daemon 2>&1 | tee test.log

      - name: Report Build Result to Branch
        if: always()
        run: |
          mkdir -p /tmp/artifacts
          [ -f build.log ] && cp build.log /tmp/artifacts/
          [ -f test.log ] && cp test.log /tmp/artifacts/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-logs-clean
          git rm -rf . >/dev/null 2>&1 || true
          echo "Status: ${{ job.status }}" > build-status.txt
          echo "Commit: ${{ github.sha }}" >> build-status.txt
          echo "Date: $(date -u)" >> build-status.txt
          [ -f /tmp/artifacts/build.log ] && cp /tmp/artifacts/build.log build.log && git add build.log
          [ -f /tmp/artifacts/test.log ] && cp /tmp/artifacts/test.log test.log && git add test.log
          git add build-status.txt
          git commit -m "Build result for ${{ github.sha }}: ${{ job.status }}"
          git push -f origin build-logs-clean:build-logs
