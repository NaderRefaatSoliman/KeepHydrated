name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepHydrated-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew test --stacktrace --no-daemon 2>&1 | tee test.log

      - name: Create or Update GitHub Release
        if: success()
        run: |
          gh release create "v3.0.0" \
            app/build/outputs/apk/debug/app-debug.apk#KeepHydrated-v3.0.0-debug.apk \
            --title "KeepHydrated V3" \
            --notes "KeepHydrated V3 Debug APK (100% Arabic localization, embedded About panel, Dr. Droppy mascot)" \
            --latest || gh release upload "v3.0.0" app/build/outputs/apk/debug/app-debug.apk#KeepHydrated-v3.0.0-debug.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Build Result to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          echo "Status: ${{ job.status }}" > build-status.txt
          echo "Commit: ${{ github.sha }}" >> build-status.txt
          echo "Date: $(date -u)" >> build-status.txt
          if [ -f build.log ]; then git add -f build.log; fi
          if [ -f test.log ]; then git add -f test.log; fi
          git add -f build-status.txt
          git commit -m "Build result for ${{ github.sha }}: ${{ job.status }}" || true
          git push -f origin build-logs
